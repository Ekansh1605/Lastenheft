[project]
name = "lastenheft"
version = "0.1.0"
description = "Sovereign multimodal document intelligence for industrial manufacturing, EU AI Act-compliant by design"
authors = [{name = "Ekansh Sharma", email = "ekanshsharma1605@gmail.com"}]
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Core ML / DL
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.46.0,<5.0",   # ColPali v1.3 incompatible with transformers 5.x (LoRA layer name change)
    "accelerate>=1.1.0",
    "sentence-transformers>=3.3.0",
    "peft>=0.13.0",
    # Multimodal RAG
    "colpali-engine>=0.3.10",
    "pdf2image>=1.17.0",
    "pypdfium2>=4.30.0",
    "pillow>=11.0.0",
    # LLM orchestration
    "langchain>=0.3.7",
    "langchain-community>=0.3.5",
    "langchain-openai>=0.2.8",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.50",
    "anthropic>=0.39.0",
    "openai>=1.54.0",
    # API + DB
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "psycopg[binary,pool]>=3.2.3",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # Eval + observability
    "ragas>=0.4.3",
    "langfuse>=2.55.0",
    "datasets>=3.1.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "rich>=13.9.4",
    "typer>=0.13.0",
    "tenacity>=9.0.0",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.29",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.4",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
